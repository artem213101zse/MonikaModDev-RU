<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BIOS · Колонна</title>
<script src="packs.js"></script>
<style>
  :root {
    --rail: 188px;
    --log: minmax(240px, 30vw);
    --bg: #12080e;
    --railbg: #0c0508;
    --pane: #1a0c12;
    --ink: #ffe6f3;
    --mute: #c989a8;
    --hot: #c94a7a;
    --ok: #7ee0a6;
    --line: #ffffff16;
    --tile: #ffffff0e;
    --logbg: #090407;
  }
  html[data-theme="light"] {
    --bg: #efe4d2;
    --railbg: #e4d5be;
    --pane: #f7efe3;
    --ink: #2a1814;
    --mute: #7a534c;
    --hot: #c94a7a;
    --ok: #2a8a58;
    --line: #2a181418;
    --tile: #fffaf3;
    --logbg: #e8dcc8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  .app {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--log);
    height: 100dvh;
    transition: grid-template-columns .22s ease;
  }
  .app.slim { --rail: 64px; }
  aside.rail {
    background: var(--railbg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 8px 6px;
  }
  .fold {
    border: 0; background: var(--tile); color: var(--ink); min-height: 40px;
    border-radius: 10px; margin-bottom: 8px; font: inherit; font-size: 16px;
  }
  .cat {
    width: 100%; border: 0; background: transparent; color: var(--mute);
    min-height: 48px; border-radius: 12px; font: inherit; margin-bottom: 4px;
    display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left;
  }
  .cat i { font-style: normal; width: 28px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .cat span { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; }
  .app.slim .cat { justify-content: center; padding: 0; }
  .app.slim .cat span { display: none; }
  .cat.on { background: var(--hot); color: #fff; }
  .cat .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--hot); margin-left: auto; flex-shrink: 0;
  }
  .cat.on .dot { background: #fff; }
  main { background: var(--pane); display: flex; flex-direction: column; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px 10px; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  h1 { margin: 2px 0 0; font-size: 22px; font-weight: 650; }
  .clock { opacity: .55; font-variant-numeric: tabular-nums; }
  .all { font-size: 12px; color: var(--mute); text-decoration: none; }
  html[data-theme="dark"] .all { color: #7ee0d6; }
  .board { flex: 1; overflow: auto; padding: 0 16px 16px; display: flex; flex-direction: column; min-height: 0; }
  .lead { font-size: 13px; color: var(--mute); margin: 0 0 10px; line-height: 1.4; }
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(150px, 1.05fr) minmax(0, 1fr);
    gap: 10px;
    min-height: 280px;
    align-items: stretch;
  }
  .hero {
    border: 0; background: var(--hot); color: #fff; text-align: left; font: inherit;
    border-radius: 22px; padding: 22px 18px 16px; cursor: pointer;
    display: flex; flex-direction: column; min-height: 280px; height: 100%;
  }
  .hero .top { flex: 1; }
  .hero b { display: block; font-size: 28px; letter-spacing: -.03em; line-height: 1.1; }
  .hero .s { display: block; margin-top: 8px; font-size: 13px; color: #ffd6ea; line-height: 1.35; }
  .hero .pbar { height: 8px; background: #0004; border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
  .hero .pbar i { display: block; height: 100%; background: #fff; }
  .opt {
    display: flex; align-items: center; gap: 8px; font-size: 13px; user-select: none; margin-top: 12px;
  }
  .opt input { width: 18px; height: 18px; accent-color: #fff; }
  .url {
    width: 100%; min-height: 40px; border: 0; border-radius: 10px; padding: 0 10px;
    background: #0003; color: #fff; font-size: 14px; margin-top: 12px;
  }
  .tog {
    width: 52px; height: 30px; border-radius: 99px; background: #0004; border: 0; position: relative; flex-shrink: 0; margin-top: 16px;
  }
  .tog.on { background: #fff; }
  .tog i {
    position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--hot);
    transition: left .18s;
  }
  .tog.on i { left: 26px; background: var(--hot); }
  .note { font-size: 12px; color: #ffd6ea; line-height: 1.35; margin-top: 10px; }
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .sm {
    flex: 1 1 0;
    border: 0; background: var(--tile); color: inherit; text-align: left; font: inherit;
    border-radius: 14px; padding: 10px 14px; min-height: 52px; cursor: pointer;
    display: flex; flex-direction: row; align-items: center; gap: 10px;
  }
  .sm b { font-size: 14px; flex: 1; }
  .sm span { font-size: 11px; color: var(--mute); text-align: right; max-width: 46%; line-height: 1.25; }
  .sm .mini { width: 48px; height: 4px; background: #0003; border-radius: 99px; overflow: hidden; flex-shrink: 0; }
  .sm .mini i { display: block; height: 100%; background: var(--hot); }
  .logpane {
    background: var(--logbg); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0;
  }
  .loghead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 12px 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute);
  }
  .loghead button { border: 0; background: transparent; color: var(--mute); font: inherit; min-height: 32px; }
  #log {
    flex: 1; margin: 0; padding: 0 12px 12px; overflow: auto; white-space: pre-wrap;
    font-size: 12px; line-height: 1.45; color: var(--ink); opacity: .8;
  }
  @media (max-width: 860px) {
    .app, .app.slim {
      grid-template-columns: var(--rail) 1fr;
      grid-template-rows: 1fr 26vh;
    }
    .logpane { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 640px) {
    .stage { grid-template-columns: 1fr; min-height: 0; }
    .hero { min-height: 200px; height: auto; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <button class="fold" id="fold" type="button" title="свернуть меню">‹</button>
    <nav id="rail"></nav>
  </aside>
  <main>
    <div class="head">
      <div>
        <div class="kicker">MAS BIOS · колонна</div>
        <h1 id="title">Игра</h1>
      </div>
      <div style="text-align:right">
        <div class="clock" id="clock"></div>
        <a class="all" href="nav.html">все виды</a>
      </div>
    </div>
    <div class="board" id="board"></div>
  </main>
  <aside class="logpane">
    <div class="loghead">Журнал <button type="button" id="wipe">очистить</button></div>
    <pre id="log">одна высокая плитка слева · мелкие горизонтальные справа · без подкатегорий</pre>
  </aside>
</div>
<script>
(function () {
  var CATS = [
    { id: "play", label: "Игра", icon: "▶", hint: "Запуск и архивы DDLC на одном экране." },
    { id: "content", label: "Контент", icon: "▣", hint: "Пакеты, подарки и музыка вместе." },
    { id: "data", label: "Данные", icon: "◇", hint: "Сейвы и файл Моники." },
    { id: "dl", label: "Загрузки", icon: "↓", hint: "Очередь: сейчас качается и что ждёт." },
    { id: "set", label: "Настройки", icon: "●", hint: "Холодный старт и тема." }
  ];
  var catId = "play";
  var slim = localStorage.getItem("mas_prev_rail") === "slim";
  var theme = localStorage.getItem("mas_prev_theme") || "dark";
  var skip = localStorage.getItem("mas_prev_skip") === "1";
  var safe = false;

  function cat() {
    var i;
    for (i = 0; i < CATS.length; i++) if (CATS[i].id === catId) return CATS[i];
    return CATS[0];
  }
  function log(cmd, extra) { biosDlLog(cmd, extra); }
  function clock() {
    var d = new Date();
    document.getElementById("clock").textContent =
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function applyChrome() {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("app").className = "app" + (slim ? " slim" : "");
    document.getElementById("fold").textContent = slim ? "›" : "‹";
    document.getElementById("fold").title = slim ? "развернуть меню" : "свернуть меню";
  }
  function rail() {
    var tot = biosDlTotals(), i, c, html = "", on, badge;
    for (i = 0; i < CATS.length; i++) {
      c = CATS[i];
      on = c.id === catId ? " on" : "";
      badge = (c.id === "dl" && tot.down) ? '<em class="dot"></em>' : "";
      html += '<button type="button" class="cat' + on + '" data-cat="' + c.id +
        '" title="' + c.label + '"><i>' + c.icon + "</i><span>" + c.label + "</span>" + badge + "</button>";
    }
    document.getElementById("rail").innerHTML = html;
  }
  function sm(o) {
    var extra = o.bar != null ? '<div class="mini"><i style="width:' + o.bar + '%"></i></div>' : "";
    return '<button type="button" class="sm" data-cmd="' + o.cmd + '" data-t="' + o.t + '"' +
      (o.id ? ' data-id="' + o.id + '"' : "") +
      (o.q ? ' data-q="' + o.q + '"' : "") + "><b>" + o.t + "</b><span>" + o.s + "</span>" + extra + "</button>";
  }
  function side(list) {
    var i, html = '<div class="side">';
    for (i = 0; i < list.length; i++) html += sm(list[i]);
    return html + "</div>";
  }
  function activePack() {
    var i, p;
    for (i = 0; i < biosDlPacks.length; i++) {
      p = biosDlPacks[i];
      if (p.status === "downloading") return p;
    }
    return null;
  }
  function stage(heroInner, list) {
    return '<div class="stage">' + heroInner + side(list) + "</div>";
  }
  function boardHtml() {
    var tot = biosDlTotals(), a = activePack(), i, p, q = [], inner;
    if (catId === "play") {
      inner = '<div class="hero" data-cmd="startGame" data-t="Запустить MAS"><div class="top"><b>Запустить MAS</b>' +
        '<span class="s">Ren\'Py → MAS OS → комната</span></div>' +
        '<label class="opt"><input type="checkbox" id="safe"' + (safe ? " checked" : "") +
        "> безопасный режим</label></div>";
      return '<p class="lead">' + cat().hint + "</p>" + stage(inner, [
        { t: "Проверить диск", s: "папки и архивы", cmd: "healthCheck" },
        { t: "Снимок папок", s: "подарки, сейвы", cmd: "diskSnapshot" },
        { t: tot.readyToPlay ? "Архивы на месте" : "Скачать недостающее",
          s: tot.needOk + " / " + tot.need + " · " + biosDlMb(tot.haveMb),
          cmd: "downloadDdlcMoe", bar: tot.pct },
        { t: "Файл с диска", s: ".rpa / zip", cmd: "pickArchive" },
        { t: "Проверить паки", s: "что уже лежит", cmd: "checkArchives" }
      ]);
    }
    if (catId === "content") {
      inner = '<div class="hero" data-cmd="downloadSubmodUrl" data-t="Скачать и поставить"><div class="top"><b>Поставить пакет</b>' +
        '<span class="s">Сабмод, спрайт или рескин — тип сам.</span>' +
        '<input class="url" placeholder="GitHub / ссылка на zip"></div></div>';
      return '<p class="lead">' + cat().hint + "</p>" + stage(inner, [
        { t: "Zip с диска", s: "пикер файла", cmd: "pickSubmodZip" },
        { t: "Библиотека", s: "что уже стоит", cmd: "listSubmods" },
        { t: "Снять последний", s: "только его файлы", cmd: "uninstallLastSubmod" },
        { t: "Положить gift", s: "characters/", cmd: "pickGift" },
        { t: "Музыка", s: "custom_bgm/", cmd: "pickMusic" },
        { t: "Обои", s: "wallpaper", cmd: "pickImage" }
      ]);
    }
    if (catId === "data") {
      inner = '<div class="hero" data-cmd="pickSavesZip" data-t="Импорт zip"><div class="top"><b>Импорт сейвов</b>' +
        '<span class="s">Zip с другой сборки. BIOS разложит persistent и слоты.</span></div></div>';
      return '<p class="lead">' + cat().hint + "</p>" + stage(inner, [
        { t: "Импорт папки", s: "уже распакованные", cmd: "pickSavesFolder" },
        { t: "Экспорт", s: "_mas/backups", cmd: "exportSaves" },
        { t: "Поделиться", s: "отправить бэкап", cmd: "shareSaves" },
        { t: "Вернуть Монику", s: "за стол в комнате", cmd: "recoverMonikaHome" },
        { t: "Статус файла", s: "characters/monika", cmd: "checkMonikaFile" },
        { t: "Найти в Documents", s: "обход папок", cmd: "recoverMonikaScan" }
      ]);
    }
    if (catId === "dl") {
      if (!a) {
        inner = '<div class="hero" data-cmd="downloadArchives" data-t="Качать недостающее" data-q="all"><div class="top"><b>' +
          (tot.readyToPlay ? "Очередь пуста" : "Ничего не качается") + "</b>" +
          '<span class="s">' + (tot.readyToPlay ? "обязательное на месте" : "нажми, чтобы поставить в очередь") +
          "</span></div></div>";
      } else {
        inner = '<div class="hero" data-id="' + a.id + '"><div class="top"><b>' + a.name + "</b>" +
          '<span class="s">' + a.file + " · " + biosDlMb(a.mb) + "</span>" +
          '<div class="pbar"><i style="width:' + a.pct + '%"></i></div>' +
          '<span class="s">' + Math.round(a.pct) + "% · " +
          (a.speed ? a.speed.toFixed(1) + " МБ/с" : "") + "</span></div></div>";
      }
      for (i = 0; i < biosDlPacks.length; i++) {
        p = biosDlPacks[i];
        if (a && p.id === a.id) continue;
        q.push({ t: p.name, s: biosDlLabels[p.status] + " · " + biosDlMb(p.mb), cmd: p.cmd, id: p.id, bar: p.pct });
      }
      q.push({ t: "Обязательное", s: "база DDLC", cmd: "downloadArchives", q: "need" });
      return '<p class="lead">' + cat().hint + "</p>" + stage(inner, q);
    }
    inner = '<div class="hero" id="skipHero"><div class="top"><b>Сразу MAS</b>' +
      '<span class="s">Миновать BIOS при холодном старте.</span>' +
      '<button type="button" class="tog' + (skip ? " on" : "") + '" id="skip"><i></i></button>' +
      '<div class="note">Вернуть BIOS из игры: в MAS OS открой плитку «BIOS» (перезапуск оболочки). Если тумблер выключен, лаунчер снова встретит при холодном старте.</div></div></div>';
    return '<p class="lead">' + cat().hint + "</p>" + stage(inner, [
      { t: theme === "dark" ? "Тема: тёмная" : "Тема: светлая", s: "нажми, чтобы сменить", cmd: "setBiosView" },
      { t: "Все файлы", s: "Android 11+", cmd: "grantAllFiles" },
      { t: "Documents", s: "папка порта", cmd: "openDocuments" },
      { t: "traceback", s: "почему не старт", cmd: "showTraceback" },
      { t: "uci шахмат", s: "libstockfish.so", cmd: "testStockfish" }
    ]);
  }
  function render() {
    var box = document.getElementById("safe");
    if (box) safe = box.checked;
    applyChrome();
    rail();
    document.getElementById("title").textContent = cat().label;
    document.getElementById("board").innerHTML = boardHtml();
  }

  document.getElementById("fold").onclick = function () {
    slim = !slim;
    localStorage.setItem("mas_prev_rail", slim ? "slim" : "open");
    applyChrome();
  };
  document.getElementById("rail").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    catId = b.getAttribute("data-cat");
    render();
  });
  document.getElementById("board").addEventListener("click", function (e) {
    var tog = e.target.closest(".tog");
    var pack = e.target.closest("[data-id]");
    var q = e.target.closest("[data-q]");
    var cmd = e.target.closest("[data-cmd]");
    var p, box;
    if (e.target.closest(".opt") || e.target.className === "url" || e.target.closest(".url")) return;
    if (tog && tog.id === "skip") {
      skip = !skip;
      localStorage.setItem("mas_prev_skip", skip ? "1" : "0");
      log("toggleBoot", skip ? "сразу MAS" : "показывать BIOS");
      render();
      return;
    }
    if (q) {
      if (q.getAttribute("data-q") === "need") biosDlDownloadRequired();
      else biosDlQueueAllMissing();
      log("downloadArchives", q.getAttribute("data-q"));
      catId = "dl";
      render();
      return;
    }
    if (pack && !e.target.closest("[data-cmd]")) {
      p = biosDlGet(pack.getAttribute("data-id"));
      if (!p) return;
      biosDlAct(p.id);
      log(p.cmd, p.name + " → " + p.status);
      render();
      return;
    }
    if (cmd) {
      if (cmd.getAttribute("data-cmd") === "startGame") {
        box = document.getElementById("safe");
        log(box && box.checked ? "startSafe" : "startGame", box && box.checked ? "безопасный режим" : "Запустить MAS");
        return;
      }
      if (cmd.getAttribute("data-cmd") === "downloadDdlcMoe") {
        biosDlQueueAllMissing();
        catId = "dl";
        log("downloadArchives", "недостающее → очередь");
        render();
        return;
      }
      if (cmd.getAttribute("data-cmd") === "setBiosView") {
        theme = theme === "dark" ? "light" : "dark";
        localStorage.setItem("mas_prev_theme", theme);
        log("setBiosView", theme === "light" ? "светлая тема" : "тёмная тема");
        render();
        return;
      }
      if (cmd.getAttribute("data-id")) {
        p = biosDlGet(cmd.getAttribute("data-id"));
        if (p) {
          biosDlAct(p.id);
          log(p.cmd, p.name + " → " + p.status);
          render();
          return;
        }
      }
      log(cmd.getAttribute("data-cmd"), cmd.getAttribute("data-t"));
    }
  });
  document.getElementById("wipe").onclick = function () {
    document.getElementById("log").textContent = "очищено";
  };
  biosDlStartTick(function () {
    rail();
    if (catId === "dl") render();
  });
  clock();
  setInterval(clock, 10000);
  applyChrome();
  render();
})();
</script>
</body>
</html>
