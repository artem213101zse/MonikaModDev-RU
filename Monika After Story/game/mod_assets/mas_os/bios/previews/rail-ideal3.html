<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BIOS · Идеальный 3</title>
<script src="packs.js"></script>
<style>
  :root {
    --rail: 188px;
    --log: minmax(240px, 30vw);
    --bg: #12080e;
    --railbg: #0c0508;
    --pane: #1a0c12;
    --ink: #ffe6f3;
    --mute: #c989a8;
    --hot: #c94a7a;
    --ok: #7ee0a6;
    --line: #ffffff16;
    --tile: #ffffff0e;
    --logbg: #090407;
  }
  html[data-theme="light"] {
    --bg: #efe4d2;
    --railbg: #e4d5be;
    --pane: #f7efe3;
    --ink: #2a1814;
    --mute: #7a534c;
    --hot: #c94a7a;
    --ok: #2a8a58;
    --line: #2a181418;
    --tile: #fffaf3;
    --logbg: #e8dcc8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
  .app {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr) var(--log);
    height: 100dvh;
    transition: grid-template-columns .22s ease;
  }
  .app.slim { --rail: 64px; }
  aside.rail {
    background: var(--railbg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 8px 6px;
  }
  .fold {
    border: 0; background: var(--tile); color: var(--ink); min-height: 40px;
    border-radius: 10px; margin-bottom: 8px; font: inherit; font-size: 16px;
  }
  .cat {
    width: 100%; border: 0; background: transparent; color: var(--mute);
    min-height: 48px; border-radius: 12px; font: inherit; margin-bottom: 4px;
    display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left;
  }
  .cat i { font-style: normal; width: 28px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .cat span { font-size: 14px; font-weight: 650; white-space: nowrap; overflow: hidden; }
  .app.slim .cat { justify-content: center; padding: 0; }
  .app.slim .cat span { display: none; }
  .cat.on { background: var(--hot); color: #fff; }
  .cat .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--hot); margin-left: auto; flex-shrink: 0;
  }
  .cat.on .dot { background: #fff; }
  main { background: var(--pane); display: flex; flex-direction: column; min-width: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; padding: 14px 16px 10px; gap: 8px; }
  .kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
  h1 { margin: 2px 0 0; font-size: 22px; font-weight: 650; }
  .clock { opacity: .55; font-variant-numeric: tabular-nums; }
  .all { font-size: 12px; color: var(--mute); text-decoration: none; }
  html[data-theme="dark"] .all { color: #7ee0d6; }
  .board { flex: 1; overflow: auto; padding: 0 16px 16px; }
  .lead { font-size: 13px; color: var(--mute); margin: 0 0 10px; line-height: 1.4; }
  .bento {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-content: start;
  }
  .tile {
    border: 0; background: var(--tile); color: inherit; text-align: left; font: inherit;
    border-radius: 16px; padding: 14px; min-height: 72px; cursor: pointer;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tile.main {
    min-height: 168px;
    background: var(--hot); color: #fff;
  }
  .tile.main.quiet {
    background: var(--tile); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .tile.wide { grid-column: 1 / -1; min-height: 56px; flex-direction: row; align-items: center; gap: 12px; }
  .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .tile.main .k { color: #ffd6ea; }
  .tile.main.quiet .k { color: var(--mute); }
  .tile b { font-size: 18px; letter-spacing: -.02em; line-height: 1.15; }
  .tile.main b { font-size: 22px; }
  .tile .s { font-size: 12px; color: var(--mute); line-height: 1.35; }
  .tile.main .s { color: #ffd6ea; }
  .tile.main.quiet .s { color: var(--mute); }
  .facts { margin-top: auto; display: flex; flex-direction: column; gap: 5px; }
  .fact {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 12px; padding-top: 5px; border-top: 1px solid #ffffff22;
  }
  .tile.main.quiet .fact { border-top-color: var(--line); }
  .st { opacity: .85; }
  .ok { color: var(--ok); }
  .tile.main .ok { color: #d4ffe6; }
  .bad { opacity: .9; }
  .pbar { height: 6px; background: #0004; border-radius: 99px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: currentColor; }
  .opt { display: flex; align-items: center; gap: 8px; font-size: 13px; user-select: none; margin-top: 4px; }
  .opt input { width: 16px; height: 16px; accent-color: #fff; }
  .url {
    width: 100%; min-height: 38px; border: 0; border-radius: 10px; padding: 0 10px;
    background: #0003; color: inherit; font-size: 13px; margin-top: 4px;
  }
  .tile.main.quiet .url { background: var(--bg); color: var(--ink); }
  .tog {
    width: 48px; height: 28px; border-radius: 99px; background: #0004; border: 0; position: relative; flex-shrink: 0;
  }
  .tog.on { background: #fff; }
  .tog i {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--hot);
    transition: left .18s;
  }
  .tog.on i { left: 23px; }
  .note { font-size: 11px; line-height: 1.35; opacity: .85; }
  .swatch { height: 22px; border-radius: 6px; }
  .swatch.d { background: linear-gradient(90deg, #12080e 50%, #c94a7a 50%); }
  .swatch.l { background: linear-gradient(90deg, #efe4d2 50%, #c94a7a 50%); }
  .logpane {
    background: var(--logbg); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-width: 0;
  }
  .loghead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 12px 8px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute);
  }
  .loghead button { border: 0; background: transparent; color: var(--mute); font: inherit; min-height: 32px; }
  #log {
    flex: 1; margin: 0; padding: 0 12px 12px; overflow: auto; white-space: pre-wrap;
    font-size: 12px; line-height: 1.45; color: var(--ink); opacity: .8;
  }
  @media (max-width: 860px) {
    .app, .app.slim {
      grid-template-columns: var(--rail) 1fr;
      grid-template-rows: 1fr 26vh;
    }
    .logpane { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 560px) {
    .bento { grid-template-columns: 1fr; }
    .tile.main { min-height: 140px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail">
    <button class="fold" id="fold" type="button" title="свернуть меню">‹</button>
    <nav id="rail"></nav>
  </aside>
  <main>
    <div class="head">
      <div>
        <div class="kicker">MAS BIOS · идеальный 3</div>
        <h1 id="title">Игра</h1>
      </div>
      <div style="text-align:right">
        <div class="clock" id="clock"></div>
        <a class="all" href="nav.html">все виды</a>
      </div>
    </div>
    <div class="board" id="board"></div>
  </main>
  <aside class="logpane">
    <div class="loghead">Журнал <button type="button" id="wipe">очистить</button></div>
    <pre id="log">несколько главных плиток · внутри статус, а не пустой цвет</pre>
  </aside>
</div>
<script>
(function () {
  var CATS = [
    { id: "play", label: "Игра", icon: "▶", hint: "Запуск и архивы рядом — две главные плитки." },
    { id: "content", label: "Контент", icon: "▣", hint: "Поставить и библиотека — оба главные." },
    { id: "data", label: "Данные", icon: "◇", hint: "Сейвы и Моника на одном экране." },
    { id: "dl", label: "Загрузки", icon: "↓", hint: "Текущий файл и очередь, без пустой колонны." },
    { id: "set", label: "Настройки", icon: "●", hint: "Сразу MAS и тема — две равные главные." }
  ];
  var catId = "play";
  var slim = localStorage.getItem("mas_prev_rail") === "slim";
  var theme = localStorage.getItem("mas_prev_theme") || "dark";
  var skip = localStorage.getItem("mas_prev_skip") === "1";
  var safe = false;

  function cat() {
    var i;
    for (i = 0; i < CATS.length; i++) if (CATS[i].id === catId) return CATS[i];
    return CATS[0];
  }
  function log(cmd, extra) { biosDlLog(cmd, extra); }
  function clock() {
    var d = new Date();
    document.getElementById("clock").textContent =
      ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function applyChrome() {
    document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("app").className = "app" + (slim ? " slim" : "");
    document.getElementById("fold").textContent = slim ? "›" : "‹";
    document.getElementById("fold").title = slim ? "развернуть меню" : "свернуть меню";
  }
  function rail() {
    var tot = biosDlTotals(), i, c, html = "", on, badge;
    for (i = 0; i < CATS.length; i++) {
      c = CATS[i];
      on = c.id === catId ? " on" : "";
      badge = (c.id === "dl" && tot.down) ? '<em class="dot"></em>' : "";
      html += '<button type="button" class="cat' + on + '" data-cat="' + c.id +
        '" title="' + c.label + '"><i>' + c.icon + "</i><span>" + c.label + "</span>" + badge + "</button>";
    }
    document.getElementById("rail").innerHTML = html;
  }
  function fact(name, val, cls) {
    return '<div class="fact"><span>' + name + '</span><span class="st ' + (cls || "") + '">' + val + "</span></div>";
  }
  function bar(pct) {
    return '<div class="pbar"><i style="width:' + pct + '%"></i></div>';
  }
  function sm(o) {
    return '<button type="button" class="tile" data-cmd="' + o.cmd + '" data-t="' + o.t + '"><b>' +
      o.t + "</b><span class=\"s\">" + o.s + "</span></button>";
  }
  function packFact(p) {
    var v = p.status === "ready" ? "готово" : (p.status === "downloading" ? Math.round(p.pct) + "%" : biosDlLabels[p.status]);
    var cls = p.status === "ready" ? "ok" : (p.status === "missing" ? "bad" : "");
    return fact(p.name, v, cls);
  }
  function needPacks() {
    var i, out = [];
    for (i = 0; i < biosDlPacks.length; i++) if (biosDlPacks[i].required) out.push(biosDlPacks[i]);
    return out;
  }
  function contentPacks() {
    var i, out = [];
    for (i = 0; i < biosDlPacks.length; i++) if (biosDlPacks[i].group === "content") out.push(biosDlPacks[i]);
    return out;
  }
  function activePack() {
    var i, p;
    for (i = 0; i < biosDlPacks.length; i++) {
      p = biosDlPacks[i];
      if (p.status === "downloading") return p;
    }
    return null;
  }
  function boardHtml() {
    var tot = biosDlTotals(), a = activePack(), i, p, html, need, cont, queued = 0;
    html = '<p class="lead">' + cat().hint + '</p><div class="bento">';
    if (catId === "play") {
      need = needPacks();
      html += '<div class="tile main" data-cmd="startGame" data-t="Запустить MAS">' +
        '<div class="k">запуск</div><b>Запустить MAS</b>' +
        '<span class="s">Ren\'Py → MAS OS → комната</span>' +
        '<label class="opt"><input type="checkbox" id="safe"' + (safe ? " checked" : "") +
        "> безопасный режим</label>" +
        '<div class="facts">' + fact("база", tot.readyToPlay ? "можно входить" : "архивы не полные", tot.readyToPlay ? "ok" : "bad") +
        fact("сабмоды", safe ? "выключены" : "как стоят") + "</div></div>";
      html += '<div class="tile main quiet" data-cmd="downloadDdlcMoe" data-t="Скачать недостающее">' +
        '<div class="k">архивы ddlc</div><b>' + (tot.readyToPlay ? "Архивы на месте" : "Скачать недостающее") + "</b>" +
        '<span class="s">' + tot.needOk + " / " + tot.need + " обязательных · " + biosDlMb(tot.haveMb) + "</span>" +
        bar(tot.pct) + '<div class="facts">';
      for (i = 0; i < need.length; i++) html += packFact(need[i]);
      html += "</div></div>";
      html += sm({ t: "Проверить диск", s: "папки, архивы, разрешение", cmd: "healthCheck" });
      html += sm({ t: "Снимок папок", s: "подарки, музыка, сейвы", cmd: "diskSnapshot" });
      html += sm({ t: "Файл с диска", s: ".rpa или zip", cmd: "pickArchive" });
      html += sm({ t: "Проверить паки", s: "что уже лежит", cmd: "checkArchives" });
    } else if (catId === "content") {
      cont = contentPacks();
      html += '<div class="tile main" data-cmd="downloadSubmodUrl" data-t="Скачать и поставить">' +
        '<div class="k">установить</div><b>Поставить пакет</b>' +
        '<span class="s">Сабмод, спрайт или рескин — тип сам.</span>' +
        '<input class="url" placeholder="GitHub / ссылка на zip">' +
        '<div class="facts">' + fact("с диска", "zip рядом → кнопка ниже") + fact("история", "listUrlHistory") + "</div></div>";
      html += '<div class="tile main quiet" data-cmd="listSubmods" data-t="Библиотека">' +
        '<div class="k">библиотека</div><b>Что уже стоит</b>' +
        '<span class="s">Снятие одного пака не трогает остальные.</span><div class="facts">';
      for (i = 0; i < cont.length; i++) html += packFact(cont[i]);
      html += "</div></div>";
      html += sm({ t: "Zip с диска", s: "пикер файла", cmd: "pickSubmodZip" });
      html += sm({ t: "Снять последний", s: "только его файлы", cmd: "uninstallLastSubmod" });
      html += sm({ t: "Положить gift", s: "characters/", cmd: "pickGift" });
      html += sm({ t: "Музыка", s: "custom_bgm/", cmd: "pickMusic" });
      html += sm({ t: "Обои", s: "custom_wallpaper.png", cmd: "pickImage" });
      html += sm({ t: "Любой файл", s: "сам разложится", cmd: "pickFile" });
    } else if (catId === "data") {
      html += '<div class="tile main" data-cmd="pickSavesZip" data-t="Импорт zip">' +
        '<div class="k">сейвы</div><b>Импорт zip</b>' +
        '<span class="s">Архив с другой сборки. BIOS разложит persistent и слоты.</span>' +
        '<div class="facts">' + fact("папка", "уже распакованные saves") + fact("бэкап", "_mas/backups") + "</div></div>";
      html += '<div class="tile main quiet" data-cmd="recoverMonikaHome" data-t="Вернуть Монику">' +
        '<div class="k">моника</div><b>Вернуть за стол</b>' +
        '<span class="s">Пустой стол в игре ждёт characters/monika.</span>' +
        '<div class="facts">' + fact("файл", "проверить статус") + fact("поиск", "обход Documents") + "</div></div>";
      html += sm({ t: "Импорт папки", s: "уже распакованные", cmd: "pickSavesFolder" });
      html += sm({ t: "Экспорт", s: "saves → backups", cmd: "exportSaves" });
      html += sm({ t: "Поделиться", s: "отправить бэкап", cmd: "shareSaves" });
      html += sm({ t: "Статус файла", s: "есть ли monika", cmd: "checkMonikaFile" });
      html += sm({ t: "Найти в Documents", s: "обход папок", cmd: "recoverMonikaScan" });
      html += sm({ t: "Собрать заново", s: "из mbase", cmd: "recoverMonikaRebuild" });
    } else if (catId === "dl") {
      for (i = 0; i < biosDlPacks.length; i++) if (biosDlPacks[i].status === "queued" || biosDlPacks[i].status === "paused") queued += 1;
      if (a) {
        html += '<div class="tile main" data-id="' + a.id + '">' +
          '<div class="k">сейчас</div><b>' + a.name + "</b>" +
          '<span class="s">' + a.file + " · " + biosDlMb(a.mb) + "</span>" + bar(a.pct) +
          '<div class="facts">' + fact("прогресс", Math.round(a.pct) + "%") +
          fact("скорость", a.speed ? a.speed.toFixed(1) + " МБ/с" : "—") +
          fact("очередь", queued + " ждут") + "</div></div>";
      } else {
        html += '<div class="tile main" data-q="all" data-cmd="downloadArchives" data-t="Качать недостающее">' +
          '<div class="k">очередь</div><b>' + (tot.readyToPlay ? "Всё на месте" : "Качать недостающее") + "</b>" +
          '<span class="s">' + biosDlMb(tot.haveMb) + " из " + biosDlMb(tot.allMb) + "</span>" + bar(tot.pct) +
          '<div class="facts">' + fact("обязательные", tot.needOk + " / " + tot.need, tot.readyToPlay ? "ok" : "bad") +
          fact("действие", tot.readyToPlay ? "можно играть" : "поставить в очередь") + "</div></div>";
      }
      html += '<div class="tile main quiet" data-q="need" data-cmd="downloadArchives" data-t="Обязательное">' +
        '<div class="k">база</div><b>Обязательное</b>' +
        '<span class="s">Без картинок и музыки MAS не стартует.</span><div class="facts">';
      need = needPacks();
      for (i = 0; i < need.length; i++) html += packFact(need[i]);
      html += "</div></div>";
      for (i = 0; i < biosDlPacks.length; i++) {
        p = biosDlPacks[i];
        if (a && p.id === a.id) continue;
        html += '<button type="button" class="tile" data-id="' + p.id + '" data-cmd="' + p.cmd + '" data-t="' + p.name + '"><b>' +
          p.name + '</b><span class="s">' + biosDlLabels[p.status] + " · " + biosDlMb(p.mb) + "</span>" + bar(p.pct) + "</button>";
      }
    } else {
      html += '<div class="tile main" id="skipHero">' +
        '<div class="k">холодный старт</div><b>Сразу MAS</b>' +
        '<span class="s">Миновать BIOS при запуске приложения.</span>' +
        '<button type="button" class="tog' + (skip ? " on" : "") + '" id="skip"><i></i></button>' +
        '<div class="note">Вернуть BIOS из игры: в MAS OS открой плитку «BIOS». Если тумблер выключен, лаунчер снова встретит при холодном старте.</div></div>';
      html += '<div class="tile main quiet" data-cmd="setBiosView" data-t="Тема">' +
        '<div class="k">вид</div><b>' + (theme === "dark" ? "Тёмная тема" : "Светлая тема") + "</b>" +
        '<span class="s">Нажми, чтобы переключить. Запоминается в браузере.</span>' +
        '<div class="swatch ' + (theme === "dark" ? "d" : "l") + '"></div>' +
        '<div class="facts">' + fact("сейчас", theme === "dark" ? "тёмная" : "светлая") + "</div></div>";
      html += sm({ t: "Все файлы", s: "разрешение Android 11+", cmd: "grantAllFiles" });
      html += sm({ t: "Documents", s: "папка порта", cmd: "openDocuments" });
      html += sm({ t: "traceback", s: "почему не стартовала", cmd: "showTraceback" });
      html += sm({ t: "uci шахмат", s: "libstockfish.so", cmd: "testStockfish" });
    }
    return html + "</div>";
  }
  function render() {
    var box = document.getElementById("safe");
    if (box) safe = box.checked;
    applyChrome();
    rail();
    document.getElementById("title").textContent = cat().label;
    document.getElementById("board").innerHTML = boardHtml();
  }

  document.getElementById("fold").onclick = function () {
    slim = !slim;
    localStorage.setItem("mas_prev_rail", slim ? "slim" : "open");
    applyChrome();
  };
  document.getElementById("rail").addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    catId = b.getAttribute("data-cat");
    render();
  });
  document.getElementById("board").addEventListener("click", function (e) {
    var tog = e.target.closest(".tog");
    var pack = e.target.closest("[data-id]");
    var q = e.target.closest("[data-q]");
    var cmd = e.target.closest("[data-cmd]");
    var p, box;
    if (e.target.closest(".opt") || e.target.closest(".url")) return;
    if (tog && tog.id === "skip") {
      skip = !skip;
      localStorage.setItem("mas_prev_skip", skip ? "1" : "0");
      log("toggleBoot", skip ? "сразу MAS" : "показывать BIOS");
      render();
      return;
    }
    if (q) {
      if (q.getAttribute("data-q") === "need") biosDlDownloadRequired();
      else biosDlQueueAllMissing();
      log("downloadArchives", q.getAttribute("data-q"));
      catId = "dl";
      render();
      return;
    }
    if (pack && pack.getAttribute("data-id") && (!cmd || pack === cmd || pack.contains(cmd))) {
      p = biosDlGet(pack.getAttribute("data-id"));
      if (p && (e.target.closest("[data-id]") === pack)) {
        biosDlAct(p.id);
        log(p.cmd, p.name + " → " + p.status);
        render();
        return;
      }
    }
    if (cmd) {
      if (cmd.getAttribute("data-cmd") === "startGame") {
        box = document.getElementById("safe");
        log(box && box.checked ? "startSafe" : "startGame", box && box.checked ? "безопасный режим" : "Запустить MAS");
        return;
      }
      if (cmd.getAttribute("data-cmd") === "downloadDdlcMoe") {
        biosDlQueueAllMissing();
        catId = "dl";
        log("downloadArchives", "недостающее → очередь");
        render();
        return;
      }
      if (cmd.getAttribute("data-cmd") === "setBiosView") {
        theme = theme === "dark" ? "light" : "dark";
        localStorage.setItem("mas_prev_theme", theme);
        log("setBiosView", theme === "light" ? "светлая тема" : "тёмная тема");
        render();
        return;
      }
      log(cmd.getAttribute("data-cmd"), cmd.getAttribute("data-t"));
    }
  });
  document.getElementById("wipe").onclick = function () {
    document.getElementById("log").textContent = "очищено";
  };
  biosDlStartTick(function () {
    rail();
    if (catId === "dl") render();
  });
  clock();
  setInterval(clock, 10000);
  applyChrome();
  render();
})();
</script>
</body>
</html>
